# 离线模式 - 用于无网环境
# 前置步骤: docker load -i read-later-server.tar
# 用法: docker-compose -f docker-compose.offline.yml up -d

services:
  readlater:
    image: read-later-server:latest
    container_name: readlater
    ports:
      - "3000:3000"
    volumes:
      # 修改为你实际的数据目录
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # CORS 配置 - 生产环境请修改
      - ALLOWED_ORIGINS=*
      # 图片大小限制（MB）
      - MAX_IMAGE_SIZE_MB=10
      # API Key 鉴权（必须修改！）
      # 生成: openssl rand -base64 32
      - API_KEY=your-secret-api-key-change-this
    restart: unless-stopped
