services:
  readlater:
    # 离线模式：直接使用已加载的镜像（通过 docker load）
    image: read-later-server:latest
    container_name: readlater
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      # 如需热更新代码，取消下面注释（开发调试使用）
      # - ./server.js:/app/server.js:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # API Key 鉴权（必须）- 请修改为随机字符串
      # 生成随机密钥：openssl rand -base64 32
      - API_KEY=your-secret-api-key-change-this
    restart: unless-stopped
