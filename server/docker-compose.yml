services:
  readlater:
    # 在线模式：从 Dockerfile 构建，并指定镜像名
    build: .
    image: read-later-server:latest
    container_name: readlater
    ports:
      - "3000:3000"
    volumes:
      # fnOS 用户请修改为实际路径，例如：
      # - /vol1/backup/readlater:/app/data
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    restart: unless-stopped
