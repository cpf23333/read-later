services:
  readlater:
    # 在线模式：从 Dockerfile 构建，并指定镜像名
    build: .
    image: read-later-server:latest
    container_name: readlater
    ports:
      - "3000:3000"
    volumes:
      # fnOS 用户请修改为实际路径，例如：
      # - /vol1/backup/readlater:/app/data
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # CORS 配置 - 生产环境请修改为实际的前端来源
      # 例如: https://your-extension.com,chrome-extension://your-extension-id
      - ALLOWED_ORIGINS=*
      # 图片大小限制（MB）
      - MAX_IMAGE_SIZE_MB=10
      # API Key 鉴权（必须）- 请修改为随机字符串
      # 生成随机密钥：openssl rand -base64 32
      - API_KEY=your-secret-api-key-change-this
    restart: unless-stopped
