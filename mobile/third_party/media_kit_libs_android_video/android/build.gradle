import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        // 预编译 jar 位于插件包根目录 libs/（本项目 vendored），
        // 而 $projectDir 指向插件包内的 android/，所以这里要用 ../libs。
        implementation files(
            "$projectDir/../libs/default-arm64-v8a.jar",
            "$projectDir/../libs/default-armeabi-v7a.jar",
            "$projectDir/../libs/default-x86.jar",
            "$projectDir/../libs/default-x86_64.jar"
        )
    }
}
