name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: docker
    container:
      image: ${{ vars.CI_REGISTRY }}/readlater-ci:latest
    env:
      NPM_CONFIG_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY }}
      npm_config_disturl: https://npmmirror.com/mirrors/node
      npm_config_prebuild_install_mirror: https://registry.npmmirror.com/-/binary/prebuild-install
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm store
        run: pnpm config set store-dir /root/.pnpm-store

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: |
            /root/.pnpm-store
            /root/.cache/node-gyp
          key: ${{ runner.os }}-pnpm-release-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'extension/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-release-

      - name: Install dependencies
        run: pnpm install

      - name: Build all
        run: |
          pnpm build
          pnpm build:firefox
          pnpm zip
          pnpm zip:firefox

      - name: Prepare release variables
        id: relvars
        run: |
          TIMESTAMP=$(date +%Y-%m-%d-%H-%M)
          SHORT_SHA=$(git rev-parse --short HEAD)
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${{ github.ref_type }}"

          if [ "$REF_TYPE" = "tag" ]; then
            echo "tag_name=${REF_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${REF_NAME}-${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${REF_NAME}-${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "release_name=${REF_NAME}-${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            {
              echo "Changelog (${PREV_TAG} → ${{ steps.relvars.outputs.release_name }}):"
              echo ""
              git log --pretty=format:"- %s" "${PREV_TAG}..HEAD"
            } > /tmp/release_notes.txt
          else
            {
              echo "Release ${{ steps.relvars.outputs.release_name }}"
              echo ""
              git log --pretty=format:"- %s" HEAD
            } > /tmp/release_notes.txt
          fi
          cat /tmp/release_notes.txt

      - name: Create Release
        id: create_release
        run: |
          TOKEN="${{ secrets.FORGEJO_TOKEN || secrets.GITEA_TOKEN }}"
          API_URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"

          PRERELEASE="${{ contains(steps.relvars.outputs.tag_name, 'alpha') || contains(steps.relvars.outputs.tag_name, 'beta') || contains(steps.relvars.outputs.tag_name, 'rc') }}"

          BODY_JSON=$(jq -Rs '.' /tmp/release_notes.txt)
          PAYLOAD=$(jq -n \
            --arg tag_name "${{ steps.relvars.outputs.tag_name }}" \
            --arg name "${{ steps.relvars.outputs.release_name }}" \
            --argjson body "$BODY_JSON" \
            --argjson draft false \
            --argjson prerelease "$PRERELEASE" \
            '{tag_name: $tag_name, name: $name, body: $body, draft: $draft, prerelease: $prerelease}')

          echo "Creating release on ${{ github.server_url }} ..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${API_URL}" \
            -d "${PAYLOAD}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to create release (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

          RELEASE_ID=$(echo "$BODY" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
          echo "release_id=${RELEASE_ID}" >> $GITHUB_OUTPUT
          echo "Created release ID: ${RELEASE_ID}"

      - name: Upload release assets
        run: |
          TOKEN="${{ secrets.FORGEJO_TOKEN || secrets.GITEA_TOKEN }}"
          API_URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.release_id }}/assets"

          for file in extension/.output/*.zip; do
            if [ -f "$file" ]; then
              echo "Uploading $(basename "$file") ..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST \
                -H "Authorization: token ${TOKEN}" \
                -F "attachment=@${file}" \
                "${API_URL}")

              if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "  OK"
              else
                echo "  FAILED (HTTP $HTTP_CODE)"
                exit 1
              fi
            fi
          done
