name: Build Mobile APK

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: 使用 Gradle 构建缓存
        type: boolean
        default: true

jobs:
  build-apk:
    runs-on: docker
    container:
      # 需要包含 Flutter 3.38.x + JDK 21 + Android SDK
      image: ${{ vars.MOBILE_CI_IMAGE }}
    env:
      HOME: /root
      PUB_CACHE: /root/.pub-cache
      GRADLE_USER_HOME: /root/.gradle
      PUB_HOSTED_URL: ${{ vars.PUB_HOSTED_URL || 'https://pub.flutter-io.cn' }}
    steps:
      - name: Verify CI image
        env:
          EXPECTED_IMAGE_VERSION: ${{ vars.MOBILE_CI_IMAGE_VERSION }}
        run: |
          echo "CI image version: ${READLATER_CI_VERSION:-unknown}"
          echo "expected image version: ${EXPECTED_IMAGE_VERSION:-unset}"
          if [ -n "${EXPECTED_IMAGE_VERSION}" ] && [ "${READLATER_CI_VERSION:-}" != "${EXPECTED_IMAGE_VERSION}" ]; then
            echo "::error::CI 镜像版本不匹配：run=$READLATER_CI_VERSION expected=$EXPECTED_IMAGE_VERSION"
            echo "更新镜像："
            echo "  docker build --build-arg IMAGE_VERSION=${EXPECTED_IMAGE_VERSION} --build-arg NODE_IMAGE=docker.m.daocloud.io/library/node:22 --build-arg PUB_HOSTED_URL=https://pub.flutter-io.cn -f mobile/ci/Dockerfile -t ${MOBILE_CI_IMAGE} mobile"
            echo "  docker push ${MOBILE_CI_IMAGE}"
            echo "  docker exec docker_dind docker rmi ${MOBILE_CI_IMAGE} || true"
            echo "  docker exec docker_dind docker pull ${MOBILE_CI_IMAGE}"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/readlater-release.jks
            echo "ANDROID_KEYSTORE_PATH=/tmp/readlater-release.jks" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_BASE64 not configured; release APK will use debug signing"
          fi

      - name: Cache Gradle build cache
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-build-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-

      - name: Prepare naming variables
        id: vars
        run: |
          TIMESTAMP=$(date +%Y-%m-%d-%H-%M)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "artifact_name=${TIMESTAMP}-readlater-android-arm64-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Show toolchain
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Analyze & test
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build arm64 release APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Verify APK native libraries
        run: |
          APK=mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          # 不要用 unzip -l | grep -q：Actions 开启 pipefail 时，
          # grep -q 会提前退出并让 unzip 收到 SIGPIPE，从而误报缺库。
          entries="$(unzip -Z1 "$APK" 2>/dev/null || true)"
          for lib in \
            lib/arm64-v8a/libmpv.so \
            lib/arm64-v8a/libmediakitandroidhelper.so; do
            if ! grep -Fxq -- "$lib" <<< "$entries"; then
              echo "::error::APK 缺少 $lib，media_kit 会在启动时黑屏"
              exit 1
            fi
          done
          echo "APK native libraries OK"

      - name: Verify APK signature
        run: |
          APK=mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if [ -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -20
          else
            echo "apksigner not found, skip signature verification"
          fi

      - name: Upload APK
        uses: forgejo/upload-artifact@v5
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
