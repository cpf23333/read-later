name: Update CI Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker
    container:
      # 依赖仓库变量 CI_REGISTRY（如 <nexus-host>:8083，末尾不要斜杠；为空会导致 invalid reference format）
      image: ${{ vars.CI_REGISTRY }}/readlater-ci:latest
      options: --privileged
    env:
      DOCKER_HOST: tcp://localhost:2375
    steps:
      - uses: actions/checkout@v7

      - name: Build and push CI image
        env:
          CI_REGISTRY: ${{ vars.CI_REGISTRY }}
          BASE_IMAGE: ${{ vars.CI_BASE_IMAGE }}
          APT_REPO_DEBIAN: ${{ vars.APT_REPO_DEBIAN }}
          APT_REPO_SECURITY: ${{ vars.APT_REPO_SECURITY }}
          NPM_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY }}
          INSECURE_REGISTRIES: ${{ vars.PRIVATE_REGISTRIES }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          cd server/ci
          ./build-and-push.sh "${CI_REGISTRY}" readlater-ci latest

      - name: Remove old CI image from DinD cache
        env:
          CI_REGISTRY: ${{ vars.CI_REGISTRY }}
        run: |
          docker rmi "${CI_REGISTRY}/readlater-ci:latest" || true
