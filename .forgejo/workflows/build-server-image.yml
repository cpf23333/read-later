name: Build Server Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker
    container:
      image: 192.168.1.100:8083/readlater-ci:latest
      options: --privileged
    env:
      NPM_CONFIG_REGISTRY: http://192.168.1.100:8081/repository/npm-proxy/
      npm_config_disturl: https://npmmirror.com/mirrors/node
      npm_config_prebuild_install_mirror: https://registry.npmmirror.com/-/binary/prebuild-install
    steps:
      - uses: actions/checkout@v4

      - name: Prepare naming variables
        id: vars
        run: |
          echo "timestamp=$(date +%Y-%m-%d-%H-%M)" >> $GITHUB_OUTPUT

      - name: Install and build server
        run: |
          echo "=== 安装依赖 ==="
          pnpm install --frozen-lockfile
          echo "=== 构建 server ==="
          cd server && pnpm rebuild && pnpm build
          echo "=== 部署 server 到独立目录 ==="
          cd .. && pnpm deploy --filter=read-later-server --prod ./server-deploy

      - name: Build image with Buildah
        env:
          STORAGE_DRIVER: vfs
        run: |
          echo "=== Buildah registry 配置 ==="
          cat /etc/containers/registries.conf || echo "未找到 /etc/containers/registries.conf"
          echo "=== 复制 Dockerfile 到部署目录 ==="
          cp server/deploy.Dockerfile server-deploy/Dockerfile
          echo "=== 使用 Buildah 构建镜像 ==="
          buildah bud -f server-deploy/Dockerfile -t read-later-server:latest ./server-deploy

      - name: Export image to tar
        env:
          STORAGE_DRIVER: vfs
        working-directory: ./server
        run: |
          echo "=== 导出镜像到 tar ==="
          mkdir -p /tmp/image-export
          buildah push read-later-server:latest dir:/tmp/image-export
          skopeo copy dir:/tmp/image-export docker-archive:read-later-server.tar:read-later-server:latest
          ls -lh read-later-server.tar

      - name: Prepare offline deployment artifacts
        working-directory: ./server
        run: |
          echo "=== 创建交付目录 ==="
          mkdir -p offline-deploy
          cp read-later-server.tar offline-deploy/
          cp docker-compose.offline.yml offline-deploy/
          cp reload.sh offline-deploy/
          cp reload.bat offline-deploy/
          ls -la offline-deploy/

      - name: Upload offline deployment artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.timestamp }}-readlater-server-offline-构建号${{ github.run_number }}
          path: server/offline-deploy/
          if-no-files-found: error
