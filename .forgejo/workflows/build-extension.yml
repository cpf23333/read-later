name: Build Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      # 依赖仓库变量 CI_REGISTRY（如 <nexus-host>:8083，末尾不要斜杠；为空会导致 invalid reference format）
      image: ${{ vars.CI_REGISTRY }}/readlater-ci:latest
    env:
      NPM_CONFIG_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY }}
      npm_config_disturl: https://npmmirror.com/mirrors/node
      npm_config_prebuild_install_mirror: https://registry.npmmirror.com/-/binary/prebuild-install
    steps:
      - uses: actions/checkout@v7

      - name: Prepare naming variables
        id: vars
        run: |
          BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH="${BRANCH//\//-}"
          echo "branch=${SAFE_BRANCH}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y-%m-%d-%H-%M)" >> $GITHUB_OUTPUT

      - name: Setup pnpm store
        run: pnpm config set store-dir /root/.pnpm-store

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: |
            /root/.pnpm-store
            /root/.cache/node-gyp
          key: ${{ runner.os }}-pnpm-ext-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'extension/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-ext-

      - name: Install dependencies
        run: pnpm install

      - name: Build Chrome Extension
        env:
          EXTENSION_KEY: ${{ vars.EXTENSION_KEY }}
        run: |
          pnpm zip
          mkdir -p extension/.output/unzipped-chrome-mv3
          unzip extension/.output/*chrome*.zip -d extension/.output/unzipped-chrome-mv3/

      - name: Upload Chrome Artifact
        uses: forgejo/upload-artifact@v5
        with:
          name: ${{ steps.vars.outputs.timestamp }}-read-later-chrome-extension-${{ steps.vars.outputs.branch }}-构建号${{ github.run_number }}
          path: extension/.output/unzipped-chrome-mv3/

      - name: Build Firefox Extension
        env:
          EXTENSION_KEY: ${{ vars.EXTENSION_KEY }}
        run: |
          pnpm zip:firefox
          mkdir -p extension/.output/unzipped-firefox
          unzip extension/.output/*firefox*.zip -d extension/.output/unzipped-firefox/

      - name: Upload Firefox Artifact
        uses: forgejo/upload-artifact@v5
        with:
          name: ${{ steps.vars.outputs.timestamp }}-read-later-firefox-extension-${{ steps.vars.outputs.branch }}-构建号${{ github.run_number }}
          path: extension/.output/unzipped-firefox/
