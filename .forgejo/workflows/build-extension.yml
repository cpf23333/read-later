name: Build Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: 192.168.1.3:8083/readlater-ci:latest
      options: --pull always
    steps:
      - uses: actions/checkout@v4

      - name: Prepare naming variables
        id: vars
        run: |
          BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH="${BRANCH//\//-}"
          echo "branch=${SAFE_BRANCH}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Setup pnpm store
        run: pnpm config set store-dir /root/.pnpm-store

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            /root/.pnpm-store
          key: ${{ runner.os }}-pnpm-ext-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-ext-

      - name: Install dependencies
        run: pnpm install

      - name: Build Chrome Extension
        env:
          EXTENSION_KEY: ${{ vars.EXTENSION_KEY }}
        run: |
          pnpm zip
          mkdir -p .output/unzipped-chrome-mv3
          unzip .output/*chrome*.zip -d .output/unzipped-chrome-mv3/

      - name: Upload Chrome Artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: read-later-chrome-extension-${{ steps.vars.outputs.branch }}-构建时间${{ steps.vars.outputs.timestamp }}-构建号${{ github.run_number }}
          path: .output/unzipped-chrome-mv3/

      - name: Build Firefox Extension
        env:
          EXTENSION_KEY: ${{ vars.EXTENSION_KEY }}
        run: |
          pnpm zip:firefox
          mkdir -p .output/unzipped-firefox
          unzip .output/*firefox*.zip -d .output/unzipped-firefox/

      - name: Upload Firefox Artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: read-later-firefox-extension-${{ steps.vars.outputs.branch }}-构建时间${{ steps.vars.outputs.timestamp }}-构建号${{ github.run_number }}
          path: .output/unzipped-firefox/
